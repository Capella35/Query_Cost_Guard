# Mock customer definition.
# The pilot customer is FICTIONAL. Its "warehouse" is the public TheLook dataset
# (bigquery-public-data.thelook_ecommerce) running in our own BigQuery project.
customer:
  name: "Northwind Outfitters"   # fictional e-commerce pilot customer
  industry: e-commerce
  pricing_model: usage           # runaways hurt the customer's bill (flat pricing would hurt our margin)

# Hard caps per workload class. These NEVER adapt — learned thresholds must sit below them.
# max_rows_processed is the DuckDB-path cost proxy (no bytes from EXPLAIN): the
# Guard compares the plan's peak estimated row count (scans and join fan-out)
# against it. On BigQuery it applies to the join fan-out estimate only
# (join_estimate.py; a dry run has no row counts). max_bytes_scanned is the
# BigQuery-path cap (dry-run bytes).
workload_classes:
  interactive:                  # dashboards, ad-hoc exploration
    max_bytes_scanned: 214748364800     # 200 GB
    max_rows_processed: 1000000         # DuckDB proxy
    max_runtime_sec: 60                 # 1 minute
  scheduled:                    # reports, pipelines
    max_bytes_scanned: 1099511627776    # 1 TB
    max_rows_processed: 10000000        # DuckDB proxy
    max_runtime_sec: 600                # 10 minutes

# Tables treated as partitioned, and their partition column — the FALLBACK.
# When the warehouse reports a table's partitioning (BigQuery), that wins and a
# disagreement with this list is traced. On DuckDB (no real partitions) this
# list is the only source: the "partition" is the date column whose zone maps
# prune row groups.
partitioned_tables:
  orders: created_at
  order_items: created_at
  events: created_at
  inventory_items: created_at

# Column registry (src/cost_guard/column_registry.py): a data-profiling
# lookup table built by scripts/build_column_registry.py on a schedule, read
# by the Guard instead of scanning columns per query.
column_registry:
  max_age_days: 35            # older entries are unverified (rule skipped, visibly)
  max_table_rows: 100000000   # size gate: larger tables are reported, not scanned
  scan_timeout_sec: 900       # per-table profiling scan
  use_approximate: true       # HyperLogLog distinct counts (measured on TheLook: -17%..+16% per column)
  value_counts_max_distinct: 1000  # rows per value for columns with <= this many distinct values (0 = off)

# Escape hatch (PROJECT_BRIEF): a blocked query runs only when this is true AND
# the caller passes a bypass reason. Every bypass is recorded in the trace.
guard:
  allow_bypass: false
  # Long-running services only (decide(rewrite_wait_sec=...)): wait at most this
  # long for a rewrite's verification, then answer without it; verification
  # finishes in the background and the same query gets the rewrite next time.
  # The one-shot CLI and the evals wait until verification is done.
  rewrite_wait_sec: 2

# Adaptive anomaly rule (anomaly.py): a completed run far above its own shape's
# history is flagged (logged, investigated; never blocked).
anomaly:
  # Owner's choice 2026-10-17 (option B): flagged runs stay OUT of the shape's
  # history, so one spike does not raise the bar for the next. Measured on the
  # online replay (eval/RESULTS_replay_online.md, held-out, run once): catch
  # 0.532 -> 0.701, false positives 0.019 -> 0.041 — a legitimate new pattern
  # is flagged every time it recurs until a person accepts it. false = option A.
  exclude_flagged: true

# Report-only investigator agent (investigator_agent.py): started when a
# completed run breaks its query shape's own history. It writes reports to
# runs/investigations/ and changes nothing.
investigator:
  enabled: true
  cooldown_min: 60        # at most one investigation per query shape per hour
  max_per_day: 20         # investigations per day, all shapes
  llm_max_per_day: 0      # optional Claude summary per report; 0 = never (deterministic only)

# Volume rule (guard.py _volume_finding; owner's priority 4, spend at volume):
# a query shape that ran at least min_runs times in window_hours and whose
# modeled total (this run included) reaches warn_usd_per_window gets a WARN
# (never a block) pointing at a summary table, materialized view or schedule.
# Logged runs count their billed bytes (a cache hit bills 0); BigQuery only.
# warn_usd_per_window is a judgment call, not a measurement.
volume:
  window_hours: 24
  min_runs: 20
  warn_usd_per_window: 5.0

# Modeled cost figures. Label every dollar number derived from this as MODELED.
cost_model:
  price_per_tb_usd: 6.25
  price_per_runtime_hour_usd: null  # set for time-billed warehouses (e.g. Snowflake
                                    # credits/hour); used only when a run has no bytes
  warehouse_size: null          # BigQuery on-demand; set if using slots/edition

# Workload report (python -m cost_guard report; src/cost_guard/ledger.py).
report:
  followup_window_min: 30       # after a warn, the user's next run within this counts as follow-up
  cache_ttl_min: 60             # identical query re-run within this = result-cache opportunity

# Warehouse backend. BigQuery is the target (2026-10-17): the evals run there
# (eval/bq_validation.yaml, eval/bq_test.yaml). DuckDB stays for the unit tests and offline demos.
warehouse:
  backend: duckdb
  duckdb:
    db_path: data/thelook.duckdb
    data_dir: data/raw            # Kaggle CSVs live here (gitignored, >500 MB)

# --- Stretch goal: BigQuery ---
bigquery:
  project: null                 # TODO: set your GCP project if/when you do the cloud path
  dataset: thelook_ecommerce
  location: US
  # Project-level safety net — set BEFORE running anything, especially Q13.
  maximum_bytes_billed: 1099511627776
  query_timeout_sec: 3600
