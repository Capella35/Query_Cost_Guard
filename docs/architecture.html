<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cost Guard + Investigator — Architecture</title>
<style>
  body { margin: 0; background: #ffffff; display: flex; justify-content: center; }
  svg { max-width: 1120px; width: 100%; height: auto; }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
</style>
</head>
<body>
<svg viewBox="0 0 1120 800" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Architecture diagram of the Cost Guard and Investigator cost-control loop">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5f6368"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="560" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">Cost Guard + Investigator — Architecture</text>
  <text x="560" y="58" text-anchor="middle" font-size="13" fill="#5f6368">Local-first · DuckDB · Deterministic gate, agents where they earn it</text>

  <!-- Analyst -->
  <rect x="30" y="230" width="150" height="110" rx="10" fill="#f1f3f4" stroke="#80868b" stroke-width="1.5"/>
  <text x="105" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#202124">Analyst</text>
  <text x="105" y="286" text-anchor="middle" font-size="12" fill="#5f6368">writes SQL</text>
  <text x="105" y="306" text-anchor="middle" font-size="12" fill="#5f6368">sees cost + verdict</text>

  <!-- Guard -->
  <rect x="230" y="130" width="300" height="290" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="380" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#202124">GUARD</text>
  <text x="380" y="180" text-anchor="middle" font-size="12" fill="#5f6368">before execution</text>
  <g>
    <rect x="250" y="196" width="260" height="34" rx="7" fill="#ffffff" stroke="#dadce0"/>
    <text x="264" y="218" font-size="12.5" fill="#202124">Cost estimate · dry-run / EXPLAIN</text>
    <rect x="250" y="238" width="260" height="34" rx="7" fill="#ffffff" stroke="#dadce0"/>
    <text x="264" y="260" font-size="12.5" fill="#202124">Static rules · Layer 1 benchmarks</text>
    <rect x="250" y="280" width="260" height="34" rx="7" fill="#ffffff" stroke="#dadce0"/>
    <text x="264" y="302" font-size="12.5" fill="#202124">Adaptive thresholds · Layer 2 (learned)</text>
    <rect x="250" y="322" width="260" height="34" rx="7" fill="#ffffff" stroke="#dadce0"/>
    <text x="264" y="344" font-size="12.5" fill="#202124">Hard caps · never adapt</text>
  </g>
  <g font-size="12" font-weight="600">
    <rect x="242" y="366" width="62" height="26" rx="13" fill="#e6f4ea" stroke="#137333"/>
    <text x="273" y="384" text-anchor="middle" fill="#137333">allow</text>
    <rect x="310" y="366" width="62" height="26" rx="13" fill="#fef7e0" stroke="#b06000"/>
    <text x="341" y="384" text-anchor="middle" fill="#b06000">warn</text>
    <rect x="378" y="366" width="62" height="26" rx="13" fill="#e8f0fe" stroke="#1a73e8"/>
    <text x="409" y="384" text-anchor="middle" fill="#1a73e8">rewrite</text>
    <rect x="446" y="366" width="62" height="26" rx="13" fill="#fce8e6" stroke="#c5221f"/>
    <text x="477" y="384" text-anchor="middle" fill="#c5221f">block</text>
  </g>
  <text x="380" y="412" text-anchor="middle" font-size="10.5" fill="#5f6368">rewrite ⇒ only if compare_results passes</text>

  <!-- Warehouse -->
  <rect x="590" y="180" width="210" height="150" rx="12" fill="#e6f4ea" stroke="#137333" stroke-width="2"/>
  <text x="695" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#202124">WAREHOUSE</text>
  <text x="695" y="236" text-anchor="middle" font-size="12.5" fill="#202124">DuckDB — primary, local</text>
  <text x="695" y="258" text-anchor="middle" font-size="12" fill="#5f6368">BigQuery — stretch goal</text>
  <text x="695" y="284" text-anchor="middle" font-size="11.5" fill="#5f6368">watchdog kills runaways</text>

  <!-- Query log -->
  <rect x="850" y="180" width="230" height="150" rx="12" fill="#fef7e0" stroke="#e37400" stroke-width="2"/>
  <text x="965" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#202124">QUERY LOG</text>
  <text x="965" y="236" text-anchor="middle" font-size="12.5" fill="#202124">fingerprints per shape</text>
  <text x="965" y="258" text-anchor="middle" font-size="12" fill="#5f6368">baselines: median / p95</text>
  <text x="965" y="284" text-anchor="middle" font-size="11.5" fill="#5f6368">runs + timings</text>

  <!-- Investigator -->
  <rect x="590" y="400" width="490" height="190" rx="12" fill="#f3e8fd" stroke="#9334e6" stroke-width="2"/>
  <text x="835" y="430" text-anchor="middle" font-size="16" font-weight="700" fill="#202124">INVESTIGATOR</text>
  <text x="835" y="450" text-anchor="middle" font-size="12" fill="#5f6368">after execution · learns the thresholds</text>
  <rect x="610" y="464" width="225" height="110" rx="8" fill="#ffffff" stroke="#dadce0"/>
  <text x="624" y="486" font-size="12" font-weight="700" fill="#202124">Workplan</text>
  <text x="624" y="504" font-size="11" fill="#5f6368">1 · enumerate query shapes</text>
  <text x="624" y="520" font-size="11" fill="#5f6368">2 · regression vs baseline</text>
  <text x="624" y="536" font-size="11" fill="#5f6368">3 · recall past incidents</text>
  <text x="624" y="552" font-size="11" fill="#5f6368">4 · draft proposals + evidence</text>
  <rect x="850" y="464" width="210" height="50" rx="8" fill="#ffffff" stroke="#dadce0"/>
  <text x="864" y="486" font-size="12" font-weight="700" fill="#202124">Episodic memory</text>
  <text x="864" y="502" font-size="11" fill="#5f6368">past incidents per shape</text>
  <rect x="850" y="524" width="210" height="50" rx="8" fill="#ffffff" stroke="#dadce0"/>
  <text x="864" y="546" font-size="12" font-weight="700" fill="#202124">Enforcement</text>
  <text x="864" y="562" font-size="11" fill="#5f6368">gates → judge → shadow → enforce</text>

  <!-- Rule store -->
  <rect x="230" y="450" width="300" height="110" rx="12" fill="#fef7e0" stroke="#e37400" stroke-width="2"/>
  <text x="380" y="480" text-anchor="middle" font-size="16" font-weight="700" fill="#202124">RULE STORE</text>
  <text x="380" y="504" text-anchor="middle" font-size="12.5" fill="#202124">static rules + learned thresholds</text>
  <text x="380" y="526" text-anchor="middle" font-size="11.5" fill="#5f6368">hard caps pinned · never adapt</text>

  <!-- Arrows -->
  <g stroke="#5f6368" stroke-width="2" fill="none">
    <line x1="180" y1="285" x2="226" y2="285" marker-end="url(#arrow)"/>
    <line x1="530" y1="255" x2="586" y2="255" marker-end="url(#arrow)"/>
    <line x1="800" y1="255" x2="846" y2="255" marker-end="url(#arrow)"/>
    <line x1="965" y1="330" x2="965" y2="396" marker-end="url(#arrow)"/>
    <path d="M 700 590 L 700 615 L 380 615 L 380 564" marker-end="url(#arrow)"/>
    <line x1="380" y1="450" x2="380" y2="424" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11" fill="#5f6368">
    <text x="203" y="277" text-anchor="middle">SQL</text>
    <text x="558" y="247" text-anchor="middle">allowed queries</text>
    <text x="823" y="247" text-anchor="middle">run history</text>
    <text x="973" y="368">history</text>
    <text x="540" y="607" text-anchor="middle">tighter thresholds</text>
    <text x="390" y="440">updated rules</text>
  </g>

  <!-- Foundations strip -->
  <rect x="30" y="650" width="520" height="80" rx="10" fill="#f8f9fa" stroke="#dadce0"/>
  <text x="52" y="680" font-size="13" font-weight="700" fill="#202124">TRACING — every decision, zero vendor</text>
  <text x="52" y="702" font-size="12" fill="#5f6368">JSONL spans: estimate · rules · verdict → runs/traces.jsonl</text>
  <rect x="570" y="650" width="510" height="80" rx="10" fill="#f8f9fa" stroke="#dadce0"/>
  <text x="592" y="680" font-size="13" font-weight="700" fill="#202124">EVAL HARNESS — the evidence base</text>
  <text x="592" y="702" font-size="12" fill="#5f6368">10 labeled cases · accuracy / catch rate / false positives</text>

  <text x="560" y="772" text-anchor="middle" font-size="11.5" fill="#5f6368">Swappable seams: warehouse backend · LLM client · rules package · telemetry</text>
</svg>
</body>
</html>
