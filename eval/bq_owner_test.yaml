# BigQuery OWNER TEST set (2026-10-18): 12 analyst queries written by the
# owner, run ONCE (run_eval.py --suite bq-owner-test). Labels are set from the
# labeling guide below and data facts only; NO Guard verdict on any of these
# queries was seen before this file was committed.
#
# PROVENANCE AND LIMITS
# - Written by the owner, not by the assistant that wrote the Guard's rules,
#   so independent of them. None repeats a query in the other sets (query
#   fingerprints compared).
# - The owner wrote them against bigquery-public-data.thelook_ecommerce; the
#   table names were pointed at the copies in cost_guard_thelook (orders,
#   order_items, events are partitioned on created_at there; users, products
#   are views on the public tables). Nothing else changed, except splitting
#   O08/O09, which had no ';' between them. `original_sql` keeps each as typed.
#   On the public (unpartitioned) tables nearly every label would be allow.
# - Facts: dry runs (bytes read), the column registry, exact join output rows
#   from per-key counts (O03), status value counts (O06); ~30 MiB billed.
# - Lopsided: 11 warn, 1 allow, 0 block, 0 rewrite; 11 of the warns rest on
#   the missing partition filter. A high score says little about blocks or
#   rewrites; it does test that 9 multi-table key joins and a many-to-many
#   join under the cap are NOT blocked (priority 2).
#
# CAPS: eval/eval_caps_bigquery.yaml, interactive - 100 MiB bytes, 5,000,000
# rows for join fan-out.
#
# LABELING GUIDE v3 (BigQuery; 2026-10-18): the rules of eval/bq_validation.yaml's header. Precedence: block > rewrite > warn > allow.
#   block   - a non-read-only statement; bytes read above the cap (100 MiB);
#             a cartesian product of two tables with more than 1,000 rows
#             each; a join that multiplies rows past 5,000,000 output rows
#             (a low-cardinality or many-to-many non-key join), with or
#             without filters; SUM/AVG of an identifier.
#             EXCEPTION (Guard, 2026-10-17): the fan-out estimate applies
#             date-partition filters and `col = value` / `col IN (values)`;
#             under any other filter (a range, LIKE, a join on an expression)
#             it is only traced, so such a fan-out is a known miss.
#   rewrite - an EQUIVALENT query (same rows and columns) that BILLS fewer
#             bytes (billed = max(bytes read, 10 MiB per table), 2026-10-17)
#             and can be produced mechanically. BigQuery prunes through
#             CAST(col AS DATE), DATE(col), TIMESTAMP_TRUNC, DATE_TRUNC(DATE(col)),
#             TIMESTAMP_ADD/SUB, DATE_ADD/SUB, EXTRACT(YEAR|DATE) and
#             FORMAT_TIMESTAMP('%Y-%m-%d', col): NOT rewrite cases. EXTRACT of
#             other parts, FORMAT_TIMESTAMP('%Y-%m', ...) and col + INTERVAL
#             defeat pruning; with an equivalent range, that is a rewrite case.
#   warn    - wasteful, risky or wrong with no equivalent fix, under the cap:
#             SELECT * reading >= 50% of the cap (column count does not
#             matter); no filter on the partition column of a partitioned
#             table (orders, order_items, events, inventory_items); GROUP BY a
#             unique key; DISTINCT that
#             cannot remove anything; an IN list of more than 100 values;
#             NOT IN over a column that can be NULL.
#   allow   - under the cap and none of the above. A filter after a join
#             inside a derived table, a CTE or subquery used twice, and HAVING
#             on a group column are NOT waste on BigQuery (measured: same
#             bytes), so on their own they are allow. So is a sort with no
#             LIMIT under the cap (owner's choice 2026-10-17, B28 measured).
# role: good = labeled allow; bad = anything else.

queries:
- id: O01
  author: owner
  pattern: missing_partition_filter
  description: Revenue, orders and customers by month (order_items x orders on order_id).
  sql: SELECT EXTRACT(MONTH FROM oi.Created_at) AS months, ROUND(SUM(oi.sale_price * o.num_of_item), 2) AS revenue,
    COUNT(DISTINCT oi.order_id) AS order_count, COUNT(DISTINCT oi.user_id) AS customers_purchased FROM order_items
    oi INNER JOIN orders AS o ON oi.order_id = o.order_id WHERE oi.status NOT IN ('Cancelled', 'Returned') GROUP
    BY months ORDER BY revenue DESC
  original_sql: SELECT EXTRACT(MONTH FROM oi.Created_at) AS months, ROUND(SUM(oi.sale_price * o.num_of_item), 2)
    AS revenue, COUNT(DISTINCT oi.order_id) AS order_count, COUNT(DISTINCT oi.user_id) AS customers_purchased FROM
    bigquery-public-data.thelook_ecommerce.order_items oi INNER JOIN `bigquery-public-data.thelook_ecommerce.orders`
    AS o ON oi.order_id = o.order_id WHERE oi.status NOT IN ('Cancelled', 'Returned') GROUP BY months ORDER BY revenue
    DESC
  guard_action_expected: warn
  role: bad
  fact: 'no filter on the partition column of order_items (and orders), partitioned on created_at in cost_guard_thelook;
    orders.order_id is a key: no fan-out'
  bytes_mib: 9.231
- id: O02
  author: owner
  pattern: missing_partition_filter
  description: Customers by country with gender counts, via a CTE (order_items x users).
  sql: WITH customers AS ( SELECT DISTINCT oi.user_id, SUM(CASE WHEN u.gender = 'M' THEN 1 ELSE null END) AS male,
    SUM(CASE WHEN u.gender = 'F' THEN 1 ELSE null END) AS female, u.country AS country FROM order_items AS oi INNER
    JOIN users AS u ON oi.user_id = u.id WHERE oi.status not in ('Cancelled', 'Returned') GROUP BY user_id, country
    ) SELECT country, COUNT(DISTINCT user_id) AS customers_count, COUNT(female) AS female, COUNT(male) AS male FROM
    customers GROUP BY country ORDER BY customers_count DESC
  original_sql: WITH customers AS ( SELECT DISTINCT oi.user_id, SUM(CASE WHEN u.gender = 'M' THEN 1 ELSE null END)
    AS male, SUM(CASE WHEN u.gender = 'F' THEN 1 ELSE null END) AS female, u.country AS country FROM bigquery-public-data.thelook_ecommerce.order_items
    AS oi INNER JOIN bigquery-public-data.thelook_ecommerce.users AS u ON oi.user_id = u.id WHERE oi.status not
    in ('Cancelled', 'Returned') GROUP BY user_id, country ) SELECT country, COUNT(DISTINCT user_id) AS customers_count,
    COUNT(female) AS female, COUNT(male) AS male FROM customers GROUP BY country ORDER BY customers_count DESC
  guard_action_expected: warn
  role: bad
  fact: no filter on the partition column of order_items (and orders), partitioned on created_at in cost_guard_thelook;
    the CTE's DISTINCT cannot remove anything (GROUP BY user_id, country already makes rows unique); users.id is
    a key
  bytes_mib: 5.155
