  bytes_mib: 1.812
- id: P10
  split: test
  author: assistant
  pattern: join_fanout_rare_value
  description: Polish users (259) paired with every user of the same gender.
  sql: SELECT a.id, b.id AS same_gender_user FROM users a JOIN users b ON a.gender = b.gender WHERE a.country =
