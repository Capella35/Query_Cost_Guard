# Column-kind eval: what each column MEANS. PRE-REGISTERED before any model call.
#
# Why: the Guard blocks SUM/AVG over an identifier (ids are counted, never
# added) and decides "identifier" by NAME today (id, *_id, *_key, *_code,
# *_no, *_num, ...). Names miss ids without such an ending (customer, ticket,
# account_number) and can flag quantities that happen to end that way
# (items_no = "number of items"), which would block a legitimate SUM. An LLM
# could classify columns once, offline, from name + type + counts (never data
# values), into a label a human reviews and the Guard then reads.
#
# Written 2026-10-16 by the AI assistant that also writes the Guard, before
# any model call; the "hard" set is invented (realistic names and counts, not
# a real warehouse) to target the gaps above. Run once:
#   .venv/bin/python eval/run_column_kinds.py
#
# KINDS (labeling guide, fixed before labeling)
#   identifier - names ONE specific entity or record: keys, foreign keys,
#                session ids, SKUs, emails, IP addresses, phone numbers.
#                Counted, joined, matched; never added or averaged.
#   quantity   - a number where arithmetic or an average means something:
#                prices, costs, amounts, ages, counts, durations, positions
#                in a sequence, coordinates.
#   date       - a date or time, however stored (TIMESTAMP, a 'YYYY-MM-DD'
#                string, a yyyymmdd integer).
#   category   - a label from a limited set, used to group: status, type,
#                gender, country, state, city, brand, department, a small
#                dimension's name.
#   text       - free-form or naming text not meant for grouping: person
#                names, product names, street addresses, URIs, subjects.
# `also_ok` lists a second acceptable kind where the guide genuinely allows
# two (e.g. a postal code is a location label AND names one area).
#
# METRICS (fixed now)
#   primary, per method, on NUMERIC columns (where SUM/AVG runs at all):
#     false_ids  = quantity columns called identifier -> would block a valid SUM
#     missed_ids = identifier columns not called identifier -> SUM goes through
#   secondary: kind accuracy over all columns (kind or also_ok counts).
# BASELINE (today's logic): identifier if the name matches the Guard's
#   IDENTIFIER_NAME; else date if the type is DATE/TIMESTAMP; else quantity if
#   numeric; else category if distinct <= 50% of rows, otherwise text.
# ADOPTION RULE (fixed now): the model's labels may replace the name pattern
#   for the SUM/AVG block only if, on BOTH sets, false_ids == 0 and
#   missed_ids <= the baseline's. Otherwise they are not adopted.
#
# The model sees, per table: every column's name, type, row count, distinct
# count and NULL share. Never values, never min/max.

