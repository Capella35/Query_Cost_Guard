  description: Query against a partitioned table with no partition filter.
  sql: SELECT event_type, COUNT(*) AS n FROM events GROUP BY event_type
  bytes_mib: 20.62
  guard_action_expected: warn
  role: bad
- id: Q04
  source: eval/eval_queries.yaml
  pattern: optimizer_may_fix
  description: Anti-pattern the BigQuery optimizer may already fix (e.g. redundant DISTINCT).
  sql: SELECT DISTINCT status, COUNT(*) AS n FROM orders WHERE created_at >= CAST('2023-07-01' AS TIMESTAMP) AND
    created_at < CAST('2023-10-01' AS TIMESTAMP) GROUP BY status
  bytes_mib: 0.06
  guard_action_expected: warn
  role: bad
- id: Q05
  source: eval/eval_queries.yaml
  pattern: optimizer_may_fix
  description: Anti-pattern the BigQuery optimizer may already fix (e.g. predicate pushdown it already does).
  sql: SELECT t.order_id, t.country FROM (SELECT o.order_id, o.created_at, u.country FROM orders AS o JOIN users
    AS u ON u.id = o.user_id) AS t WHERE t.created_at >= CAST('2023-06-01' AS TIMESTAMP) AND t.country = 'Japan'
  bytes_mib: 4.01
  label_from:
    label: rewrite
    reason: 'filter after a join inside a derived table: BigQuery pushes it down; the pushdown rewrite billed the
      same bytes (eval/RESULTS_bq_dryrun_full.md)'
  guard_action_expected: allow
  role: good
- id: Q06
  source: eval/eval_queries.yaml
  pattern: cross_join_without_condition
  description: Explicit CROSS JOIN with no join condition.
  sql: SELECT u.id AS user_id, p.id AS product_id FROM users AS u CROSS JOIN products AS p
  bytes_mib: 0.99
  guard_action_expected: block
  role: bad
- id: Q07
  source: eval/eval_queries.yaml
  pattern: function_on_partition_column
  description: Function wrapped around the partition column in a filter (kills partition pruning).
  sql: SELECT order_id, status FROM orders WHERE TIMESTAMP_TRUNC(created_at, MONTH) = CAST('2023-06-01' AS TIMESTAMP)
  bytes_mib: 0.03
  label_from:
    label: rewrite
    reason: 'TIMESTAMP_TRUNC(created_at, MONTH) = X prunes on BigQuery: 0.03 MiB; no fewer-bytes equivalent'
  guard_action_expected: allow
  role: good
- id: Q08
  source: eval/eval_queries.yaml
  pattern: filter_after_join
  description: Filter applied after the join instead of before it.
  sql: SELECT j.order_id, j.sale_price FROM (SELECT oi.order_id, oi.sale_price, oi.created_at, p.category FROM order_items
    AS oi JOIN products AS p ON p.id = oi.product_id) AS j WHERE j.category = 'Jeans' AND j.created_at >= CAST('2023-01-01'
    AS TIMESTAMP)
  bytes_mib: 5.23
  label_from:
    label: rewrite
    reason: 'filter after a join inside a derived table: BigQuery pushes it down; the pushdown rewrite billed the
      same bytes (eval/RESULTS_bq_dryrun_full.md)'
  guard_action_expected: allow
  role: good
- id: Q09
  source: eval/eval_queries.yaml
  pattern: repeated_subquery_no_cte
  description: Identical subquery repeated instead of a CTE.
  sql: SELECT a.user_id, a.spend, b.spend AS spend_again FROM (SELECT user_id, SUM(sale_price) AS spend FROM order_items
    WHERE created_at >= CAST('2023-01-01' AS TIMESTAMP) GROUP BY user_id) AS a JOIN (SELECT user_id, SUM(sale_price)
    AS spend FROM order_items WHERE created_at >= CAST('2023-01-01' AS TIMESTAMP) GROUP BY user_id) AS b ON a.user_id
    = b.user_id ORDER BY a.spend DESC, a.user_id NULLS LAST LIMIT 100
  bytes_mib: 3.5
  label_from:
    label: rewrite
    reason: 'repeated subquery: the CTE rewrite billed the same bytes on BigQuery (eval/RESULTS_bq_dryrun_full.md);
      no fewer-bytes equivalent'
  guard_action_expected: allow
  role: good
- id: Q10
  source: eval/eval_queries.yaml
