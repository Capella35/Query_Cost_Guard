  sql: SELECT u.email, p.name FROM users u, products p WHERE u.country = 'Brasil' AND p.category = 'Jeans'
  bytes_mib: 5.19
  guard_action_expected: block
  role: bad
- id: B18
  source: eval/bq_queries.yaml
  pattern: join_fanout
  description: 'Join users to events on state (~230 values, not a key): ~10^9 rows; ~29 MiB read.'
  sql: SELECT u.id, COUNT(*) AS n FROM users u JOIN events e ON e.state = u.state GROUP BY u.id
  bytes_mib: 28.46
  guard_action_expected: block
  role: bad
- id: B19
  source: eval/bq_queries.yaml
  pattern: join_fanout
  description: 'Same state join limited to one month of events: still ~10^7 rows (60k events x 100k users / 230).'
  sql: SELECT u.id, COUNT(*) AS n FROM users u JOIN events e ON e.state = u.state WHERE e.created_at >= TIMESTAMP
    '2023-12-01' AND e.created_at < TIMESTAMP '2024-01-01' GROUP BY u.id
  bytes_mib: 2.35
  guard_action_expected: block
  role: bad
- id: B20
  source: eval/bq_queries.yaml
  pattern: non_read_only
  description: CREATE TABLE AS SELECT — writes.
  sql: CREATE OR REPLACE TABLE cost_guard_thelook.big_orders AS SELECT * FROM orders WHERE num_of_item > 3
  bytes_mib: 6.48
  guard_action_expected: block
  role: bad
- id: B21
  source: eval/bq_queries.yaml
  pattern: unprunable_wrapper
  description: EXTRACT(YEAR ...) on the partition column reads every partition; the 2023 range is equivalent and
    prunes.
  sql: SELECT COUNT(*) AS purchases FROM events WHERE EXTRACT(YEAR FROM created_at) = 2023 AND event_type = 'purchase'
  label_change:
    from: rewrite
    to: allow
    from_role: bad
    date: 2026-10-16
    reason: 'label error found after the run: the guide treated EXTRACT as defeating pruning, generalized from a
      measurement of EXTRACT(DAY); measured afterwards, BigQuery prunes through EXTRACT(YEAR) (eval/RESULTS_bigquery.md
      notes), so by the guide''s own rule this is a partition-filtered, clean query; approved relabel'
  bytes_mib: 4.59
  guard_action_expected: allow
  role: good
- id: B22
  source: eval/bq_queries.yaml
  pattern: unprunable_wrapper
  description: FORMAT_TIMESTAMP('%Y-%m', ...) = '2023-06' reads every partition; the June range is equivalent and
    prunes.
  sql: SELECT order_id, sale_price FROM order_items WHERE FORMAT_TIMESTAMP('%Y-%m', created_at) = '2023-06'
  bytes_mib: 4.16
  label_change:
    from: rewrite
    to: warn
    date: '2026-10-17'
    reason: 'owner''s policy 2026-10-17: a rewrite must BILL fewer bytes (BigQuery bills at least 10 MiB per table);
      dry run 4.155 -> 0.034 MiB read, 10 -> 10 MiB billed, so no rewrite; the unprunable wrapper still warns'
  guard_action_expected: warn
  role: bad
- id: B23
  source: eval/bq_queries.yaml
  pattern: unprunable_wrapper
  description: Arithmetic on the partition column (col + INTERVAL) defeats pruning; created_at >= '2023-12-01' is
    equivalent.
  sql: SELECT COUNT(*) AS n FROM orders WHERE created_at + INTERVAL 1 DAY >= TIMESTAMP '2023-12-02'
  bytes_mib: 0.96
  label_change:
    from: rewrite
    to: warn
    date: '2026-10-17'
    reason: 'owner''s policy 2026-10-17: a rewrite must BILL fewer bytes (BigQuery bills at least 10 MiB per table);
      dry run 0.958 -> 0.713 MiB read, 10 -> 10 MiB billed, so no rewrite; the unprunable wrapper still warns'
  guard_action_expected: warn
  role: bad
- id: B24
  source: eval/bq_queries.yaml
  pattern: select_star
  description: SELECT * on users (16 columns) — every column billed.
  sql: SELECT * FROM users WHERE country = 'Japan'
  label_change:
    from: warn
    to: allow
    from_role: bad
    date: 2026-10-17
    reason: 'owner''s policy change 2026-10-17: SELECT * is judged on cost, not column count (flagged at >= 50%
      of the class cap, or a median runtime >= 50% of the runtime limit after 20 runs); this query reads 18.9 MiB
      (dry run), 19% of the 100 MiB interactive cap, far below half the cap'
  bytes_mib: 18.9
  guard_action_expected: allow
  role: good
- id: B25
  source: eval/bq_queries.yaml
  pattern: missing_partition_filter
  description: Order status counts over all of history, no date filter.
  sql: SELECT status, COUNT(*) AS n FROM orders GROUP BY status
  bytes_mib: 1.23
  guard_action_expected: warn
  role: bad
- id: B26
  source: eval/bq_queries.yaml
  pattern: meaningless_aggregate
  description: SUM of an ID column.
  sql: SELECT SUM(user_id) AS total_users FROM orders WHERE created_at >= TIMESTAMP '2023-12-01'
  label_change:
    from: warn
    to: block
    date: 2026-10-16
    reason: 'policy change by the project owner after the run: SUM/AVG over an identifier is blocked (ids are counted,
      never added); approved relabel'
  bytes_mib: 1.43
  guard_action_expected: block
  role: bad
- id: B27
  source: eval/bq_queries.yaml
  pattern: group_by_unique_key
  description: 'GROUP BY the events primary key: every group is one row.'
  sql: SELECT id, COUNT(*) AS n FROM events WHERE created_at >= TIMESTAMP '2023-01-01' AND created_at < TIMESTAMP
    '2024-01-01' GROUP BY id
  bytes_mib: 4.34
  guard_action_expected: warn
  role: bad
- id: B28
  source: eval/bq_queries.yaml
  pattern: sort_no_limit
  description: Sort a year of events (~500k rows) with no LIMIT.
  sql: SELECT id, user_id, event_type, created_at FROM events WHERE created_at >= TIMESTAMP '2023-01-01' AND created_at
    < TIMESTAMP '2024-01-01' ORDER BY created_at
  bytes_mib: 7.82
  label_change:
    from: warn
    to: allow
    date: '2026-10-17'
    reason: 'owner''s choice after the first validation run: sort with no LIMIT is cheap at this size; live runs
      2026-10-17 sorting 284,310 rows took 9.3 slot-s / 1.4 s vs 7.0 slot-s / 0.6 s with LIMIT 1000, same 10 MiB
      billed'
    from_role: bad
  guard_action_expected: allow
  role: good
