# BigQuery VALIDATION set: the BigQuery-native eval queries (B, T), labeled for
# BigQuery. Built by scripts/build_bq_validation.py — edit the script, not this
# file. Tune on this set and rerun it freely. There is no untouched test set
# now: a fresh pool is to be written, pre-registered and split at random.
#
# Provenance: B01-B30 were written for BigQuery (run once 2026-10-16); T01-T40
# were written for BigQuery as the test set (pre-registered ddf0030, run once
# 2026-10-17: 35/40), then fixes followed its misses. All 70 have been run, so
# none is held out. The DuckDB-era Q and H queries left on 2026-10-17. `label_from` records a label changed for
# BigQuery when this set was built, with the measured reason. `label_change`
# records a label changed AFTER this set was run; run_eval.py scores both the
# original and the current labels. `bytes_mib` is the dry run at build time.
#
# CAPS: eval/eval_caps_bigquery.yaml, interactive — 100 MiB bytes, 5,000,000
# rows for join fan-out, 300 s runtime.
#
# LABELING GUIDE v2 (BigQuery; 2026-10-17). Precedence: block > rewrite > warn > allow.
#   block   - a non-read-only statement; bytes read above the cap (100 MiB);
#             a cartesian product of two tables with more than 1,000 rows
#             each; a join that multiplies rows past 5,000,000 output rows
#             (a low-cardinality or many-to-many non-key join), with or
#             without filters; SUM/AVG of an identifier.
#             EXCEPTION (Guard, 2026-10-17): the fan-out estimate applies
#             date-partition filters and `col = value` / `col IN (values)`;
#             under any other filter (a range, LIKE, a join on an expression)
#             it is only traced, so such a fan-out is a known miss.
#   rewrite - an EQUIVALENT query (same rows and columns) that BILLS fewer
#             bytes (billed = max(bytes read, 10 MiB per table), 2026-10-17)
#             and can be produced mechanically. BigQuery prunes through
#             CAST(col AS DATE), DATE(col), TIMESTAMP_TRUNC, DATE_TRUNC(DATE(col)),
#             TIMESTAMP_ADD/SUB, DATE_ADD/SUB, EXTRACT(YEAR|DATE) and
#             FORMAT_TIMESTAMP('%Y-%m-%d', col): NOT rewrite cases. EXTRACT of
#             other parts, FORMAT_TIMESTAMP('%Y-%m', ...) and col + INTERVAL
#             defeat pruning; with an equivalent range, that is a rewrite case.
#   warn    - wasteful, risky or wrong with no equivalent fix, under the cap:
#             SELECT * reading >= 50% of the cap (column count does not
#             matter); no filter on the partition column of a partitioned
#             table (orders, order_items, events, inventory_items); GROUP BY a
#             unique key; DISTINCT that
#             cannot remove anything; an IN list of more than 100 values;
#             NOT IN over a column that can be NULL.
#   allow   - under the cap and none of the above. A filter after a join
#             inside a derived table, a CTE or subquery used twice, and HAVING
#             on a group column are NOT waste on BigQuery (measured: same
#             bytes), so on their own they are allow. So is a sort with no
#             LIMIT under the cap (owner's choice 2026-10-17, B28 measured).
# role: good = labeled allow; bad = anything else.
# Not testable here: the SELECT * runtime clause (needs 20 logged runs).

queries:
- id: B01
  source: eval/bq_queries.yaml
  pattern: clean
  description: Monthly completed revenue for 2023, TIMESTAMP_TRUNC in the SELECT only.
  sql: SELECT TIMESTAMP_TRUNC(created_at, MONTH) AS month, SUM(sale_price) AS revenue FROM `cost_guard_thelook.order_items`
    WHERE created_at >= TIMESTAMP '2023-01-01' AND created_at < TIMESTAMP '2024-01-01' AND status = 'Complete' GROUP
    BY month ORDER BY month
  bytes_mib: 0.49
  guard_action_expected: allow
  role: good
- id: B02
  source: eval/bq_queries.yaml
  pattern: clean
  description: Daily events by type for one week, filtered with DATE(created_at) — BigQuery prunes through DATE().
  sql: SELECT DATE(created_at) AS day, event_type, COUNT(*) AS n FROM events WHERE DATE(created_at) BETWEEN '2023-11-20'
    AND '2023-11-26' GROUP BY day, event_type
  bytes_mib: 0.1
  guard_action_expected: allow
  role: good
- id: B03
  source: eval/bq_queries.yaml
  pattern: clean
  description: Users per country (small view, backticked column).
  sql: SELECT `country`, COUNT(*) AS users FROM users GROUP BY `country` ORDER BY users DESC
  bytes_mib: 0.95
  guard_action_expected: allow
  role: good
- id: B04
  source: eval/bq_queries.yaml
  pattern: clean
  description: Top 10 products by Q3 2023 revenue.
  sql: SELECT p.name, SUM(oi.sale_price) AS revenue FROM order_items AS oi JOIN products AS p ON p.id = oi.product_id
    WHERE oi.created_at >= TIMESTAMP '2023-07-01' AND oi.created_at < TIMESTAMP '2023-10-01' GROUP BY p.name ORDER
    BY revenue DESC LIMIT 10
  bytes_mib: 1.75
  guard_action_expected: allow
  role: good
- id: B05
  source: eval/bq_queries.yaml
  pattern: clean
  description: Return rate by category over the last 90 days of 2023 (SAFE_DIVIDE, COUNTIF, TIMESTAMP_SUB on a constant).
  sql: SELECT p.category, SAFE_DIVIDE(COUNTIF(oi.status = 'Returned'), COUNT(*)) AS return_rate FROM order_items
    oi JOIN products p ON p.id = oi.product_id WHERE oi.created_at >= TIMESTAMP_SUB(TIMESTAMP '2024-01-01', INTERVAL
    90 DAY) AND oi.created_at < TIMESTAMP '2024-01-01' GROUP BY p.category
  bytes_mib: 0.71
  guard_action_expected: allow
  role: good
- id: B06
  source: eval/bq_queries.yaml
  pattern: clean
  description: Latest order per user in one week (QUALIFY).
  sql: SELECT user_id, order_id, created_at FROM orders WHERE created_at >= TIMESTAMP '2023-12-01' AND created_at
    < TIMESTAMP '2023-12-08' QUALIFY ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY created_at DESC) = 1
  bytes_mib: 0.01
  guard_action_expected: allow
  role: good
- id: B07
  source: eval/bq_queries.yaml
  pattern: clean
  description: Products per distribution center (two small views).
  sql: SELECT dc.name, COUNT(*) AS products FROM products p JOIN distribution_centers dc ON dc.id = p.distribution_center_id
    GROUP BY dc.name
  bytes_mib: 0.22
  guard_action_expected: allow
  role: good
- id: B08
  source: eval/bq_queries.yaml
  pattern: clean
  description: Unsold inventory by department, Q1 2023 stock.
  sql: SELECT product_department, COUNT(*) AS unsold FROM inventory_items WHERE created_at >= TIMESTAMP '2023-01-01'
    AND created_at < TIMESTAMP '2023-04-01' AND sold_at IS NULL GROUP BY product_department
  bytes_mib: 0.24
  guard_action_expected: allow
  role: good
- id: B09
  source: eval/bq_queries.yaml
  pattern: prunable_wrapper
  description: Black Friday purchases and sessions per traffic source; TIMESTAMP_TRUNC on the partition column,
    which BigQuery prunes through.
  sql: SELECT traffic_source, COUNTIF(event_type = 'purchase') AS purchases, COUNT(DISTINCT session_id) AS sessions
    FROM events WHERE TIMESTAMP_TRUNC(created_at, DAY) = TIMESTAMP '2023-11-24' GROUP BY traffic_source
  bytes_mib: 0.05
  guard_action_expected: allow
  role: good
- id: B10
  source: eval/bq_queries.yaml
  pattern: filter_after_join
  description: Filter written after the join inside a derived table; BigQuery pushes it down (0 bytes saved by the
    pushdown rewrite), so not waste here.
  sql: SELECT t.order_id, t.state FROM (SELECT o.order_id, o.created_at, u.state FROM orders o JOIN users u ON u.id
    = o.user_id) t WHERE t.created_at >= TIMESTAMP '2023-12-01' AND t.state = 'California'
  bytes_mib: 4.0
  guard_action_expected: allow
  role: good
- id: B11
  source: eval/bq_queries.yaml
  pattern: cte_twice
  description: Month-over-month revenue from a CTE referenced twice.
  sql: WITH m AS (SELECT DATE_TRUNC(DATE(created_at), MONTH) AS month, SUM(sale_price) AS rev FROM order_items WHERE
    created_at >= TIMESTAMP '2023-01-01' AND created_at < TIMESTAMP '2024-01-01' GROUP BY month) SELECT cur.month,
    cur.rev, prev.rev AS prev_rev FROM m AS cur LEFT JOIN m AS prev ON prev.month = DATE_SUB(cur.month, INTERVAL
    1 MONTH) ORDER BY cur.month
  bytes_mib: 0.3
  guard_action_expected: allow
  role: good
- id: B12
  source: eval/bq_queries.yaml
  pattern: clean
  description: Users by age band and gender (CASE).
  sql: SELECT CASE WHEN age < 25 THEN 'under 25' WHEN age < 45 THEN '25-44' ELSE '45+' END AS band, gender, COUNT(*)
    AS n FROM users GROUP BY band, gender
  bytes_mib: 1.05
  guard_action_expected: allow
  role: good
- id: B13
  source: eval/bq_queries.yaml
  pattern: clean
  description: US users in four states (short IN list).
  sql: SELECT state, COUNT(*) AS users FROM users WHERE country = 'United States' AND state IN ('California', 'Texas',
    'New York', 'Florida') GROUP BY state
  bytes_mib: 2.04
  guard_action_expected: allow
  role: good
- id: B14
  source: eval/bq_queries.yaml
  pattern: clean
  description: Approximate sessions per browser in December 2023.
  sql: SELECT browser, APPROX_COUNT_DISTINCT(session_id) AS sessions FROM events WHERE created_at >= TIMESTAMP '2023-12-01'
    AND created_at < TIMESTAMP '2024-01-01' GROUP BY browser
  bytes_mib: 1.36
  guard_action_expected: allow
  role: good
- id: B15
  source: eval/bq_queries.yaml
  pattern: bytes_cap
  description: 'Every column of events, all partitions: ~367 MiB, over the 100 MiB cap.'
  sql: SELECT * FROM events WHERE event_type = 'purchase'
  bytes_mib: 367.19
  guard_action_expected: block
